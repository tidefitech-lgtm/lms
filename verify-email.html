<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Verify Your Email | TIDEF ITECH LMS</title>
    <link
      rel="icon"
      href="https://www.tidefitech.com/img/Capture-removebg-preview.png"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-visual">
        <div class="brand">
          <img
            src="https://www.tidefitech.com/img/Capture-removebg-preview.png"
            alt="TIDEF ITECH"
          />
          <span class="brand-name">TIDEF ITECH LMS</span>
        </div>
        <div>
          <h2>Almost there — just confirm it's you.</h2>
          <p>
            Enter the one-time code we sent to confirm your TIDEF ITECH account.
          </p>
        </div>
        <p style="font-size: 0.82rem">
          © 2026 TIDEF ITECH — Makurdi, Benue State
        </p>
      </div>

      <div class="auth-form-side">
        <div class="auth-form-wrap">
          <div class="eyebrow">ONE MORE STEP</div>
          <h1>Enter your verification code</h1>
          <p class="sub" id="sub-text">
            We've sent a one-time code to your email.
          </p>

          <div id="form-alert"></div>

          <div class="field">
            <label for="otp">One-time code</label>
            <input
              class="input"
              id="otp"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="8"
              placeholder="Enter code"
            />
          </div>
          <button class="btn btn-primary btn-block" id="verify-btn">
            Verify code
          </button>

          <div class="field mt-4">
            <label for="resend-identifier">Didn't get it? Resend a code</label>
            <input
              class="input"
              id="resend-identifier"
              type="email"
              placeholder="you@example.com"
            />
          </div>
          <button class="btn btn-outline btn-block" id="resend-btn">
            Resend code
          </button>

          <p class="switch-link">
            <a href="./login.html">&larr; Back to log in</a>
          </p>
        </div>
      </div>
    </div>

    <script type="module">
      import {
        resendSignupOtp,
        verifySignupOtp,
        getUserProfile,
      } from "./js/auth.js";
      import { ROLE_HOME_PAGE } from "./js/config.js";
      import {
        showToast,
        setButtonLoading,
        getQueryParam,
      } from "./js/utils.js";

      const identifier =
        getQueryParam("identifier") || getQueryParam("email") || "";
      document.getElementById("resend-identifier").value = identifier;
      document.getElementById("sub-text").textContent =
        "We've sent a one-time code to your email.";

      const verifyBtn = document.getElementById("verify-btn");
      const resendBtn = document.getElementById("resend-btn");
      const alertBox = document.getElementById("form-alert");

      async function finishVerification(user) {
        const profile = await getUserProfile(user.id);
        if (
          profile?.role === "student" &&
          profile.account_status !== "approved"
        ) {
          window.location.href = "./student/pending-approval.html";
        } else {
          window.location.href =
            ROLE_HOME_PAGE[profile?.role] || "./student/dashboard.html";
        }
      }

      verifyBtn.addEventListener("click", async () => {
        const token = document.getElementById("otp").value.trim();
        if (!token) {
          alertBox.innerHTML = `<div class="alert alert-warning">Enter the code we sent you.</div>`;
          return;
        }
        setButtonLoading(verifyBtn, true, "Verifying…");
        try {
          const user = await verifySignupOtp(identifier, token);
          await finishVerification(user);
        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-danger">That code is invalid or expired. Request a new code and try again.</div>`;
          setButtonLoading(verifyBtn, false);
        }
      });

      resendBtn.addEventListener("click", async () => {
        const resendIdentifier = document
          .getElementById("resend-identifier")
          .value.trim();
        if (!resendIdentifier) {
          showToast("Enter your email address first.", "error");
          return;
        }
        setButtonLoading(resendBtn, true, "Sending…");
        try {
          await resendSignupOtp(resendIdentifier);
          showToast("Verification code sent again.", "success");
        } catch (err) {
          showToast("Couldn't resend right now. Try again shortly.", "error");
        }
        setButtonLoading(resendBtn, false);
      });
    </script>
  </body>
</html>
