<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Students | TIDEF ITECH LMS Admin</title>
<link rel="icon" href="https://www.tidefitech.com/img/Capture-removebg-preview.png" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
<style>
  .s-row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 0; border-bottom:1px solid var(--border-subtle); flex-wrap:wrap; }
  .s-row:last-child { border-bottom:none; }
  .filters { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .filters .input { max-width:220px; }
</style>
</head>
<body>

<script type="module">
  import { requireAuth } from "../js/guards.js";
  import { renderAppShell } from "../js/components.js";
  import { getAllUsers, setAccountStatus } from "../js/admin.js";
  import { escapeHtml, formatDate, showToast, setButtonLoading } from "../js/utils.js";

  const { profile } = await requireAuth({ allowedRoles: ["admin", "super_admin"] });
  const content = renderAppShell({ role: profile.role, profile, pageTitle: "Students", activeHref: "students.html" });

  content.innerHTML = `
    <div class="filters">
      <input class="input" id="search" placeholder="Search name, email, or student ID…" />
      <select class="input" id="statusFilter">
        <option value="">All account statuses</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="suspended">Suspended</option>
        <option value="rejected">Rejected</option>
      </select>
    </div>
    <div class="card"><div id="list"><div class="state-block"><div class="spinner"></div></div></div></div>
  `;

  const searchInput = document.getElementById("search");
  const statusFilter = document.getElementById("statusFilter");
  let debounceTimer;
  searchInput.addEventListener("input", () => { clearTimeout(debounceTimer); debounceTimer = setTimeout(loadList, 300); });
  statusFilter.addEventListener("change", loadList);

  async function loadList() {
    const list = document.getElementById("list");
    list.innerHTML = `<div class="state-block"><div class="spinner"></div></div>`;
    try {
      let students = await getAllUsers({ role: "student", search: searchInput.value.trim() || null });
      if (statusFilter.value) students = students.filter((s) => s.account_status === statusFilter.value);

      if (students.length === 0) {
        list.innerHTML = `<div class="state-block"><p>No matching students.</p></div>`;
        return;
      }
      list.innerHTML = "";
      students.forEach((s) => list.appendChild(renderRow(s)));
    } catch (err) {
      list.innerHTML = `<div class="alert alert-danger">Couldn't load students.</div>`;
    }
  }

  function renderRow(s) {
    const row = document.createElement("div");
    row.className = "s-row";
    const statusBadge = { approved: "badge-success", pending: "badge-warning", suspended: "badge-danger", rejected: "badge-neutral" }[s.account_status] || "badge-neutral";
    const paymentBadge = { confirmed: "badge-success", pending_verification: "badge-warning", rejected: "badge-danger", not_submitted: "badge-neutral" }[s.payment_status] || "badge-neutral";

    row.innerHTML = `
      <div>
        <div style="font-weight:600; color:var(--navy-900);">${escapeHtml(s.full_name || "—")} ${s.student_id ? `<span class="text-secondary" style="font-weight:400;">(${escapeHtml(s.student_id)})</span>` : ""}</div>
        <div class="text-secondary" style="font-size:0.85rem;">${escapeHtml(s.email || "")}${s.phone ? " · " + escapeHtml(s.phone) : ""} · Registered ${formatDate(s.created_at)}</div>
      </div>
      <div class="flex items-center gap-3">
        <span class="badge ${statusBadge}">${s.account_status}</span>
        <span class="badge ${paymentBadge}">${s.payment_status.replace("_", " ")}</span>
        ${s.account_status === "suspended"
          ? `<button class="btn btn-success btn-sm" data-action="reactivate">Reactivate</button>`
          : s.account_status === "approved"
          ? `<button class="btn btn-danger btn-sm" data-action="suspend">Suspend</button>`
          : ""}
      </div>
    `;

    row.querySelector('[data-action="suspend"]')?.addEventListener("click", async (e) => {
      if (!confirm(`Suspend ${s.full_name || "this student"}?`)) return;
      setButtonLoading(e.currentTarget, true, "…");
      try { await setAccountStatus(s.id, "suspended"); loadList(); } catch (err) { showToast(err.message, "error"); }
    });
    row.querySelector('[data-action="reactivate"]')?.addEventListener("click", async (e) => {
      setButtonLoading(e.currentTarget, true, "…");
      try { await setAccountStatus(s.id, "approved"); loadList(); } catch (err) { showToast(err.message, "error"); }
    });

    return row;
  }

  loadList();
</script>
</body>
</html>
