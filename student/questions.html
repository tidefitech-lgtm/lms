<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Q&A | TIDEF ITECH LMS</title>
<link rel="icon" href="https://www.tidefitech.com/img/Capture-removebg-preview.png" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
<style>
  .t-row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 0; border-bottom:1px solid var(--border-subtle); flex-wrap:wrap; }
  .t-row:last-child { border-bottom:none; }
</style>
</head>
<body>

<script type="module">
  import { requireAuth } from "../js/guards.js";
  import { renderAppShell } from "../js/components.js";
  import { getMyEnrolledCourses, getCurriculum } from "../js/courses.js";
  import { getThreadsForCourses, createThread } from "../js/community.js";
  import { uploadFile } from "../js/storage.js";
  import { escapeHtml, formatDateTime, showToast, setButtonLoading, getQueryParam } from "../js/utils.js";

  const { profile, user } = await requireAuth({ allowedRoles: ["student"] });
  const content = renderAppShell({ role: "student", profile, pageTitle: "Q&A", activeHref: "questions.html" });

  const enrolled = await getMyEnrolledCourses();
  const preselectCourse = getQueryParam("course");
  const preselectLesson = getQueryParam("lesson");

  content.innerHTML = `
    <div class="flex items-center justify-between mb-4" style="flex-wrap:wrap; gap:12px;">
      <h2 style="margin:0;">Questions & Answers</h2>
      <button class="btn btn-primary" id="new-btn">+ Ask a Question</button>
    </div>

    <div class="card mb-4 ${preselectCourse ? "" : "hidden"}" id="new-card">
      <h3>Ask a Question</h3>
      <div id="ask-alert"></div>
      <form id="ask-form">
        <div class="form-row-2">
          <div class="field"><label for="courseId">Course</label><select class="input" id="courseId" required></select></div>
          <div class="field"><label for="lessonId">Lesson (optional)</label><select class="input" id="lessonId"><option value="">General course question</option></select></div>
        </div>
        <div class="field"><label for="title">Question title</label><input class="input" id="title" required /></div>
        <div class="field"><label for="body">Details</label><textarea class="input" id="body" rows="3"></textarea></div>
        <div class="field"><label for="fileInput">Attach a file or image (optional)</label><input class="input" type="file" id="fileInput" /></div>
        <button type="submit" class="btn btn-primary" id="ask-btn">Post Question</button>
      </form>
    </div>

    <div class="card"><div id="list"><div class="state-block"><div class="spinner"></div></div></div></div>
  `;

  const courseSelect = document.getElementById("courseId");
  courseSelect.innerHTML = enrolled.map((e) => `<option value="${e.courses.id}">${escapeHtml(e.courses.name)}</option>`).join("") || '<option value="">No enrolled courses</option>';
  if (preselectCourse) courseSelect.value = preselectCourse;

  async function loadLessonOptions() {
    const lessonSelect = document.getElementById("lessonId");
    lessonSelect.innerHTML = '<option value="">General course question</option>';
    if (!courseSelect.value) return;
    const modules = await getCurriculum(courseSelect.value);
    modules.forEach((m) => {
      m.lessons.forEach((l) => {
        const opt = document.createElement("option");
        opt.value = l.id;
        opt.textContent = `${m.title} — ${l.title}`;
        lessonSelect.appendChild(opt);
      });
    });
    if (preselectLesson) lessonSelect.value = preselectLesson;
  }
  courseSelect.addEventListener("change", loadLessonOptions);
  if (preselectCourse) loadLessonOptions();

  document.getElementById("new-btn").addEventListener("click", () => document.getElementById("new-card").classList.toggle("hidden"));

  document.getElementById("ask-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById("ask-alert");
    alertBox.innerHTML = "";
    const btn = document.getElementById("ask-btn");
    setButtonLoading(btn, true, "Posting…");
    try {
      const fileInput = document.getElementById("fileInput");
      let attachmentPath = null;
      if (fileInput.files[0]) attachmentPath = await uploadFile("community-files", user.id, fileInput.files[0]);
      await createThread({
        courseId: courseSelect.value,
        lessonId: document.getElementById("lessonId").value || null,
        title: document.getElementById("title").value.trim(),
        body: document.getElementById("body").value.trim(),
        attachmentPath,
      });
      showToast("Question posted.", "success");
      document.getElementById("ask-form").reset();
      document.getElementById("new-card").classList.add("hidden");
      loadList();
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
    }
    setButtonLoading(btn, false);
  });

  async function loadList() {
    const list = document.getElementById("list");
    list.innerHTML = `<div class="state-block"><div class="spinner"></div></div>`;
    try {
      const threads = await getThreadsForCourses(enrolled.map((e) => e.courses.id));
      if (threads.length === 0) {
        list.innerHTML = `<div class="state-block"><p>No questions yet — be the first to ask!</p></div>`;
        return;
      }
      list.innerHTML = threads.map((t) => `
        <div class="t-row">
          <div>
            <div style="font-weight:600; color:var(--navy-900);">${escapeHtml(t.title)}</div>
            <div class="text-secondary" style="font-size:0.85rem;">${escapeHtml(t.courses?.name || "")}${t.lessons ? " · " + escapeHtml(t.lessons.title) : ""} · ${escapeHtml(t.profiles?.full_name || "Unknown")} · ${formatDateTime(t.created_at)}</div>
          </div>
          <div class="flex items-center gap-3">
            ${t.is_resolved ? '<span class="badge badge-success">Resolved</span>' : '<span class="badge badge-neutral">Open</span>'}
            <a class="btn btn-outline btn-sm" href="./question-thread.html?id=${t.id}">Open</a>
          </div>
        </div>
      `).join("");
    } catch (err) {
      list.innerHTML = `<div class="alert alert-danger">Couldn't load questions.</div>`;
    }
  }

  loadList();
</script>
</body>
</html>
