<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Courses | TIDEF ITECH LMS</title>
<link rel="icon" href="https://www.tidefitech.com/img/Capture-removebg-preview.png" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
<style>
  .course-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:20px; }
  .course-card { border:1px solid var(--border-subtle); border-radius:var(--radius-lg); overflow:hidden; background:var(--white); display:flex; flex-direction:column; }
  .course-card .thumb { height:120px; background:var(--gradient-brand); display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-weight:700; font-size:1.1rem; text-align:center; padding:12px; }
  .course-card .body { padding:16px; display:flex; flex-direction:column; gap:8px; flex:1; }
</style>
</head>
<body>

<script type="module">
  import { requireAuth } from "../js/guards.js";
  import { renderAppShell } from "../js/components.js";
  import { getMyEnrolledCourses } from "../js/courses.js";
  import { escapeHtml } from "../js/utils.js";

  const { profile } = await requireAuth({ allowedRoles: ["student"] });
  const content = renderAppShell({ role: "student", profile, pageTitle: "My Courses", activeHref: "courses.html" });

  content.innerHTML = `<div id="course-grid" class="course-grid"><div class="state-block"><div class="spinner"></div></div></div>`;

  try {
    const enrollments = await getMyEnrolledCourses();
    const grid = document.getElementById("course-grid");
    if (enrollments.length === 0) {
      grid.innerHTML = `<div class="card" style="grid-column:1/-1;"><div class="state-block"><p>You're not enrolled in any courses yet. Once TIDEF ITECH enrolls you, they'll appear here.</p></div></div>`;
    } else {
      grid.innerHTML = enrollments.map((e) => `
        <a class="course-card" href="./course.html?id=${e.courses.id}" style="text-decoration:none;">
          <div class="thumb">${escapeHtml(e.courses.name)}</div>
          <div class="body">
            <span class="badge ${e.status === "completed" ? "badge-success" : "badge-info"}">${e.status}</span>
            <div class="text-secondary" style="font-size:0.85rem;">${escapeHtml(e.courses.category || "")}</div>
          </div>
        </a>
      `).join("");
    }
  } catch (err) {
    document.getElementById("course-grid").innerHTML = `<div class="alert alert-danger">Couldn't load your courses.</div>`;
  }
</script>
</body>
</html>
