<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student ID Card | TIDEF ITECH LMS</title>
<link rel="icon" href="https://www.tidefitech.com/img/Capture-removebg-preview.png" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
<style>
  .id-card { width:100%; max-width:380px; margin:0 auto; border-radius:20px; overflow:hidden; box-shadow:var(--shadow-lg); background:var(--white); }
  .id-card-header { background:var(--gradient-brand); color:#fff; padding:16px 20px; display:flex; align-items:center; gap:10px; }
  .id-card-header img { height:30px; }
  .id-card-body { padding:24px 20px; text-align:center; }
  .id-photo { width:96px; height:96px; border-radius:50%; background:var(--gradient-gold); color:var(--navy-900); display:flex; align-items:center; justify-content:center; font-size:1.8rem; font-weight:700; margin:0 auto 14px; border:4px solid var(--off-white); }
  .id-name { font-family:var(--font-display); font-weight:700; font-size:1.15rem; color:var(--navy-900); margin-bottom:2px; }
  .id-role { color:var(--text-secondary); font-size:0.85rem; margin-bottom:16px; }
  .id-row { display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid var(--border-subtle); text-align:left; font-size:0.88rem; }
  .id-row label { color:var(--text-secondary); }
  .id-card-footer { background:var(--off-white); padding:12px 20px; text-align:center; font-size:0.72rem; color:var(--text-secondary); letter-spacing:0.03em; }
  @media print {
    .no-print { display:none !important; }
    body { background:#fff !important; }
  }
</style>
</head>
<body>

<script type="module">
  import { requireAuth } from "/js/guards.js";
  import { renderAppShell } from "/js/components.js";
  import { getMyEnrolledCourses } from "/js/courses.js";
  import { escapeHtml, getInitials, formatDate } from "/js/utils.js";

  const { profile } = await requireAuth({ allowedRoles: ["student"] });
  const content = renderAppShell({ role: "student", profile, pageTitle: "Student ID Card", activeHref: "id-card.html" });

  if (!profile.student_id) {
    content.innerHTML = `<div class="card"><div class="state-block"><p>Your Student ID hasn't been assigned yet — this happens automatically once your payment is confirmed.</p></div></div>`;
  } else {
    const enrollments = await getMyEnrolledCourses();
    const courseName = enrollments[0]?.courses?.name || "Not yet enrolled";

    content.innerHTML = `
      <div class="id-card">
        <div class="id-card-header">
          <img src="https://www.tidefitech.com/img/Capture-removebg-preview.png" alt="TIDEF ITECH" />
          <strong>TIDEF ITECH</strong>
        </div>
        <div class="id-card-body">
          <div class="id-photo">${profile.profile_photo_url ? `<img src="${profile.profile_photo_url}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;" />` : getInitials(profile.full_name)}</div>
          <div class="id-name">${escapeHtml(profile.full_name || "")}</div>
          <div class="id-role">Student</div>
          <div class="id-row"><label>Student ID</label><strong>${escapeHtml(profile.student_id)}</strong></div>
          <div class="id-row"><label>Course</label><span>${escapeHtml(courseName)}</span></div>
          <div class="id-row"><label>Status</label><span class="badge badge-success">Active</span></div>
          <div class="id-row"><label>Member Since</label><span>${formatDate(profile.created_at)}</span></div>
        </div>
        <div class="id-card-footer">VERIFICATION CODE: ${escapeHtml(profile.student_id)}</div>
      </div>
      <div class="text-center mt-4 no-print">
        <button class="btn btn-primary" onclick="window.print()">🖨 Print / Save as PDF</button>
      </div>
    `;
  }
</script>
</body>
</html>
