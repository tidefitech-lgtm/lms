<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student ID Card | TIDEF ITECH LMS</title>
    <link
      rel="icon"
      href="https://www.tidefitech.com/img/Capture-removebg-preview.png"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      .id-card {
        position: relative;
        width: 100%;
        max-width: 350px;
        height: 590px;
        margin: 0 auto;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 18px 45px rgba(15, 36, 74, 0.2);
        text-align: center;
      }
      .id-card::before,
      .id-card::after {
        content: "";
        position: absolute;
        pointer-events: none;
      }
      .id-card::before {
        top: -34px;
        left: -36px;
        width: 120px;
        height: 150px;
        background: #1111a8;
        clip-path: polygon(0 0, 100% 0, 55% 45%, 100% 45%, 25% 100%, 0 100%);
      }
      .id-card::after {
        right: -34px;
        bottom: -25px;
        width: 155px;
        height: 175px;
        background: #ff6900;
        clip-path: polygon(38% 0, 100% 0, 100% 100%, 0 100%, 42% 56%, 0 56%);
      }
      .id-card-frame {
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(17, 17, 168, 0.18);
        pointer-events: none;
      }
      .id-card-header {
        position: relative;
        z-index: 1;
        padding: 20px 20px 4px;
        color: #1111a8;
      }
      .id-card-header img {
        display: block;
        height: 36px;
        margin: 0 auto 2px;
      }
      .id-card-header strong {
        font-family: var(--font-display);
        font-size: 1rem;
        letter-spacing: 0.01em;
      }
      .id-card-body {
        position: relative;
        z-index: 1;
        padding: 8px 24px 18px;
      }
      .id-photo {
        width: 210px;
        height: 210px;
        border-radius: 50%;
        overflow: hidden;
        background: #e8e8ee;
        color: var(--navy-900);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: 700;
        margin: 0 auto 10px;
        border: 7px solid #1111a8;
      }
      .id-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .id-name {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.25rem;
        line-height: 1.15;
        color: #20251f;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .id-role {
        color: #20251f;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .id-qr {
        display: block;
        width: 96px;
        height: 96px;
        margin: 0 auto 6px;
        padding: 4px;
        background: #fff;
        border: 1px solid #20251f;
        image-rendering: auto;
      }
      .id-number {
        color: #30352f;
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .id-website {
        color: #30352f;
        font-size: 0.78rem;
        margin-top: 4px;
      }
      .id-card-footer {
        position: relative;
        z-index: 1;
        padding: 6px 20px 14px;
        text-align: center;
        font-size: 0.68rem;
        color: #30352f;
        letter-spacing: 0.08em;
      }
      .id-card-footer::before {
        content: "";
        display: block;
        width: 100%;
        height: 1px;
        margin-bottom: 8px;
        background: #30352f;
      }
      @media print {
        .no-print {
          display: none !important;
        }
        body {
          background: #fff !important;
        }
        .id-card {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { requireAuth } from "../js/guards.js";
      import { renderAppShell } from "../js/components.js";
      import { toDriveImageUrl } from "../js/google-drive.js";
      import { escapeHtml, getInitials } from "../js/utils.js";

      const { profile } = await requireAuth({ allowedRoles: ["student"] });
      const content = renderAppShell({
        role: "student",
        profile,
        pageTitle: "Student ID Card",
        activeHref: "id-card.html",
      });

      if (!profile.student_id) {
        content.innerHTML = `<div class="card"><div class="state-block"><p>Your Student ID hasn't been assigned yet — this happens automatically once your payment is confirmed.</p></div></div>`;
      } else {
        const qrData = encodeURIComponent(
          `TIDEF ITECH student ID: ${profile.student_id}`,
        );
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${qrData}`;
        const photo = profile.profile_photo_url
          ? `<img src="${escapeHtml(toDriveImageUrl(profile.profile_photo_url))}" alt="${escapeHtml(profile.full_name || "Student photo")}" />`
          : escapeHtml(getInitials(profile.full_name));

        content.innerHTML = `
      <div class="id-card">
        <div class="id-card-frame"></div>
        <div class="id-card-header">
          <img src="https://www.tidefitech.com/img/Capture-removebg-preview.png" alt="TIDEF ITECH" />
          <strong>TIDEF ITECH</strong>
        </div>
        <div class="id-card-body">
          <div class="id-photo">${photo}</div>
          <div class="id-name">${escapeHtml(profile.full_name || "")}</div>
          <div class="id-role">Student</div>
          <img class="id-qr" src="${qrUrl}" alt="QR code for ${escapeHtml(profile.student_id)}" />
          <div class="id-number">${escapeHtml(profile.student_id)}</div>
          <div class="id-website">www.tidefitech.com</div>
        </div>
        <div class="id-card-footer">TIDEF ITECH STUDENT IDENTIFICATION</div>
      </div>
      <div class="text-center mt-4 no-print">
        <button class="btn btn-primary" onclick="window.print()">🖨 Print / Save as PDF</button>
      </div>
    `;
      }
    </script>
  </body>
</html>
