<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set New Password | TIDEF ITECH LMS</title>
<link rel="icon" href="https://www.tidefitech.com/img/Capture-removebg-preview.png" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <div class="brand">
      <img src="https://www.tidefitech.com/img/Capture-removebg-preview.png" alt="TIDEF ITECH" />
      <span class="brand-name">TIDEF ITECH LMS</span>
    </div>
    <div>
      <h2>Choose a strong new password.</h2>
      <p>Use at least 8 characters. You'll be signed in right after.</p>
    </div>
    <p style="font-size:0.82rem;">© 2026 TIDEF ITECH — Makurdi, Benue State</p>
  </div>

  <div class="auth-form-side">
    <div class="auth-form-wrap">
      <div class="eyebrow">NEW PASSWORD</div>
      <h1>Set a new password</h1>
      <p class="sub" id="sub-text">Enter a new password for your account below.</p>

      <div id="form-alert"></div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input class="input" type="password" id="password" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input class="input" type="password" id="confirmPassword" required minlength="8" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="reset-btn">Set New Password</button>
      </form>

      <p class="switch-link"><a href="./login.html">&larr; Back to log in</a></p>
    </div>
  </div>
</div>

<script type="module">
  import { setNewPassword, getUserProfile, getFreshUser } from "./js/auth.js";
  import { supabase } from "./js/supabase.js";
  import { ROLE_HOME_PAGE } from "./js/config.js";
  import { setButtonLoading, setFieldError, clearFieldError } from "./js/utils.js";

  const form = document.getElementById("reset-form");
  const alertBox = document.getElementById("form-alert");
  const resetBtn = document.getElementById("reset-btn");
  const subText = document.getElementById("sub-text");

  // The reset-link click carries a recovery token in the URL that
  // supabase-js parses automatically into a temporary session.
  let hasRecoverySession = false;
  supabase.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") hasRecoverySession = true;
  });

  (async () => {
    const user = await getFreshUser();
    if (!user) {
      subText.textContent = "This reset link looks invalid or expired. Request a new one from the forgot-password page.";
      form.classList.add("hidden");
    }
  })();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.innerHTML = "";
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    clearFieldError(password);
    clearFieldError(confirmPassword);

    if (password.value.length < 8) {
      setFieldError(password, "Use at least 8 characters.");
      return;
    }
    if (password.value !== confirmPassword.value) {
      setFieldError(confirmPassword, "Passwords don't match.");
      return;
    }

    setButtonLoading(resetBtn, true, "Saving…");
    try {
      await setNewPassword(password.value);
      const user = await getFreshUser();
      const profile = await getUserProfile(user.id);
      alertBox.innerHTML = `<div class="alert alert-success">Password updated! Redirecting…</div>`;
      setTimeout(() => {
        if (profile?.role === "student" && profile.account_status !== "approved") {
          window.location.href = "./student/pending-approval.html";
        } else {
          window.location.href = ROLE_HOME_PAGE[profile?.role] || "./student/dashboard.html";
        }
      }, 1200);
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-danger">${err.message || "Couldn't update your password. The link may have expired — request a new one."}</div>`;
      setButtonLoading(resetBtn, false);
    }
  });
</script>
</body>
</html>
