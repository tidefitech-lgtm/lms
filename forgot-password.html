<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Reset Password | TIDEF ITECH LMS</title>
<link rel="icon" href="https://www.tidefitech.com/img/Capture-removebg-preview.png" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <div class="brand">
      <img src="https://www.tidefitech.com/img/Capture-removebg-preview.png" alt="TIDEF ITECH" />
      <span class="brand-name">TIDEF ITECH LMS</span>
    </div>
    <div>
      <h2>Forgot your password? No problem.</h2>
      <p>Enter your account email and we'll send you a secure link to set a new one.</p>
    </div>
    <p style="font-size:0.82rem;">© 2026 TIDEF ITECH — Makurdi, Benue State</p>
  </div>

  <div class="auth-form-side">
    <div class="auth-form-wrap">
      <div class="eyebrow">RESET PASSWORD</div>
      <h1>Reset your password</h1>
      <p class="sub">We'll email you a link to choose a new one.</p>

      <div id="form-alert"></div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input class="input" type="email" id="email" required autocomplete="email" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="reset-btn">Send Reset Link</button>
      </form>

      <p class="switch-link"><a href="./login.html">&larr; Back to log in</a></p>
    </div>
  </div>
</div>

<script type="module">
  import { requestPasswordReset } from "./js/auth.js";
  import { setButtonLoading } from "./js/utils.js";

  const form = document.getElementById("reset-form");
  const alertBox = document.getElementById("form-alert");
  const resetBtn = document.getElementById("reset-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.innerHTML = "";
    const email = document.getElementById("email").value.trim();

    setButtonLoading(resetBtn, true, "Sending…");
    try {
      await requestPasswordReset(email);
    } catch (err) {
      // Swallow the specific error — never confirm/deny account existence.
    }
    alertBox.innerHTML = `<div class="alert alert-success">If an account exists for ${email}, a reset link is on its way. Check your inbox.</div>`;
    form.reset();
    setButtonLoading(resetBtn, false);
  });
</script>
</body>
</html>
